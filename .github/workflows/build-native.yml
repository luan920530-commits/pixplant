name: Build native apps (macOS Intel · Windows · Linux)

# Compila los instaladores nativos en máquinas reales de cada sistema:
#   macos-15-intel → Mac con procesador Intel (x64) .dmg / .zip
#                    (macos-13 fue retirado por GitHub el 2025-12-04;
#                     macos-15-intel es su reemplazo oficial, hasta ago-2027)
#   windows-latest → Windows (x64)                .exe (NSIS + portable)
#   ubuntu-latest  → Linux (x64)                  .AppImage / .deb
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel # runner Intel x86_64 real (reemplazo de macos-13, retirado)
            target: mac
          - name: Windows
            os: windows-latest
            target: win
          - name: Linux
            os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar instalador (${{ matrix.name }})
        run: npx electron-builder --${{ matrix.target }} --x64 --publish never
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TexPlant-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
